name: hr-agency-infra
services:
  # ===================
  # Infrastructure
  # ===================
  postgres:
    image: postgres:17
    container_name: hr-agency-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_app
      POSTGRES_USER: hr_app
      POSTGRES_PASSWORD: hr_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_app -d hr_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
