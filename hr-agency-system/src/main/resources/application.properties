spring.application.name=hr-agency-system

# ===================
# Database
# ===================

spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/hr_app
spring.datasource.username=${PG_USER:hr_app}
spring.datasource.password=${PG_PASSWORD:hr_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================
# JPA
# ===================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

### SWAGGER
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-spec

# ===================
# Flyway
# ===================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
jwt.secret=${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast32CharactersLong}

# ===================
# Database Pool
# ===================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# ===================
# Logging
# ===================

logging.level.root=INFO
logging.level.com.pl.hragency=INFO

