<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aplikacja wysłana | Careers</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">

<header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center px-6 py-5 lg:px-8">

        <a href="/"
           class="flex items-center gap-3">

            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-900 text-sm font-bold text-white">
                HR
            </div>

            <div>
                <div class="text-sm font-semibold tracking-tight text-slate-900">
                    HR Agency
                </div>

                <div class="text-xs text-slate-500">
                    Careers
                </div>
            </div>
        </a>

    </div>
</header>

<main class="flex min-h-[calc(100vh-137px)] items-center justify-center px-6 py-16">

    <div class="w-full max-w-2xl">

        <div class="rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-sm sm:p-12">

            <!-- Success icon -->
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-50">
                <svg class="h-8 w-8 text-emerald-600"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="m5 12 4 4L19 6"/>
                </svg>
            </div>

            <p class="mt-6 text-sm font-semibold uppercase tracking-wider text-emerald-600">
                Aplikacja wysłana
            </p>

            <h1 class="mt-3 text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl">
                Dziękujemy za aplikację!
            </h1>

            <p class="mx-auto mt-5 max-w-xl text-base leading-7 text-slate-600">
                Otrzymaliśmy Twoją aplikację i przekażemy ją do naszego zespołu rekrutacyjnego.
                Skontaktujemy się z Tobą, jeśli będziemy chcieli porozmawiać o kolejnych krokach.
            </p>
        </div>

        <p class="mt-6 text-center text-xs text-slate-400">
            Możesz bezpiecznie zamknąć tę stronę.
        </p>

    </div>

</main>

<footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto px-6 py-6 text-center text-sm text-slate-500">
        © 2026 HR Agency
    </div>
</footer>

</body>
</html>
